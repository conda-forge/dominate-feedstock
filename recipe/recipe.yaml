schema_version: 1

context:
  name: dominate
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/dominate-${{ version }}.tar.gz
  sha256: 926989c819db2fe91e590590a2902183685edd94829c8cfba5fd71af57c1a982

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=62
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dominate
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: Dominate is a Python library for creating and manipulating HTML documents using an elegant DOM API.
  homepage: http://github.com/Knio/dominate/
  repository: https://github.com/Knio/dominate

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
